<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salida del Cráter</title>
<style>
:root{--bg:#1a0a14;--ink:#ffd9a8;--acc:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:480/720;max-width:100%}
canvas{width:100%;height:100%;display:block;background:#2a0f1e;image-rendering:pixelated}
#touch{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;color:var(--ink);font-size:26px;touch-action:none}
#touch .mid{width:84px;height:84px;background:#ff7a3d55}
#touch div{display:flex;gap:10px;align-items:flex-end}
#shop{position:absolute;top:8px;right:8px;width:200px;background:#1a0a14ee;border:1px solid #ff7a3d88;padding:8px;display:none;font-size:12px}
#shop b{display:block;margin-bottom:4px}
#shop button{display:block;width:100%;margin:4px 0;padding:6px;background:#3a1520;color:#ffd9a8;border:1px solid #ff7a3d66;text-align:left;font:inherit;cursor:pointer}
#shop button:disabled{opacity:.45;cursor:default}
</style>
</head>

<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<div id="shop"></div><div id="touch"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="fire">●</button><button data-k="up" class="mid">▲</button></div></div>
</div>

const docks=[40,95,150,205,260,315,370].map((m,i)=>({m,side:i%2?1:-1,n:i+1}));
const K={};
const hw=m=>{const b=160+35*Math.sin(m*.11)+15*Math.sin(m*.37+1);const t=Math.min(1,Math.max(0,(m-(RIM-14))/14));return b+t*t*(3-2*t)*(330-b)};
const dockRect=d=>{const e=hw(d.m);return d.side<0?[CX-e,CX-e+110]:[CX+e-110,CX+e]};
const kmap={ArrowUp:'up',KeyW:'up',Space:'fire',KeyJ:'fire',KeyZ:'fire',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{audio();if(kmap[e.code]){K[kmap[e.code]]=true;e.preventDefault()}if((e.code==='KeyR'||e.code==='Enter')&&s.state!=='play')reset();if(e.code==='KeyM')muted=!muted;const n='Digit1Digit2Digit3Digit4'.indexOf(e.code);if(n>=0&&n%6===0&&s.landed&&s.state==='play')buy(n/6)});
addEventListener('keyup',e=>{if(kmap[e.code])K[kmap[e.code]]=false});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{audio();K[k]=true;if(s.state!=='play')reset();e.preventDefault()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[k]=false));
});
let s,w,money=0;const U={motor:0,tank:0,shield:0,gun:0};
const ITEMS=[['motor','Motor (+velocidad)',60],['tank','Tanque (+combustible)',50],['shield','Escudo (+1 golpe)',80],['gun','Cañón (+cadencia)',50]];
const shopEl=document.getElementById('shop');let shopOn=false;
const cost=i=>Math.round(ITEMS[i][2]*Math.pow(1.6,U[ITEMS[i][0]]));
function applyUp(){TH=200+30*U.motor;MAXF=100+25*U.tank;AX=260+30*U.motor;CD=Math.max(.08,.28-.04*U.gun)}
function renderShop(){let h='<b>TIENDA · $'+money+'</b>';ITEMS.forEach((it,i)=>{const L=U[it[0]],mx=L>=5;h+='<button onclick="buy('+i+')" '+((mx||money<cost(i))?'disabled':'')+'>'+(i+1)+'. '+it[1]+'<br>Nv '+L+'/5 · '+(mx?'MAX':'$'+cost(i))+'</button>'});shopEl.innerHTML=h}
function shopSync(){const on=!!s.landed&&s.state==='play';if(on!==shopOn){shopOn=on;shopEl.style.display=on?'block':'none'}}
function buy(i){const k=ITEMS[i][0],c=cost(i);if(U[k]>=5||money<c){SND.no();return}money-=c;U[k]++;applyUp();if(k==='shield')s.shield=U.shield;if(k==='tank')s.fuel=Math.min(MAXF,s.fuel+25);SND.buy();renderShop()}
// ---- sonido (sintetizado con WebAudio) ----
let AC,NB,eng,egain,muted=false;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
eng=AC.createOscillator();eng.type='sawtooth';eng.frequency.value=48;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;egain=AC.createGain();egain.gain.value=0;eng.connect(f);f.connect(egain);egain.connect(AC.destination);eng.start()}catch(e){AC=null}}
function tone(f,d,type='square',v=.12,f2){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.3,fq=1200){if(!AC||muted)return;const n=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;n.buffer=NB;f.type='lowpass';f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(80,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);n.stop(t+d)}
const SND={shoot:()=>tone(880,.12,'square',.07,220),box:()=>{noise(.25,.35,2500);tone(660,.08,'triangle',.1)},coin:()=>{tone(988,.08,'square',.06);setTimeout(()=>tone(1319,.15,'square',.06),70)},crash:()=>{noise(.9,.6,900);tone(120,.6,'sawtooth',.2,30)},hit:()=>{noise(.3,.4,3000);tone(200,.2,'sawtooth',.15,60)},land:()=>tone(90,.18,'sine',.3,40),buy:()=>{tone(523,.09,'triangle',.12);setTimeout(()=>tone(784,.14,'triangle',.12),90)},no:()=>tone(150,.15,'square',.08),laser:()=>tone(1500,.1,'sawtooth',.04,600),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.14),i*140))};
function engSnd(){if(!AC)return;const t=AC.currentTime,on=s.state==='play'&&!muted;egain.gain.setTargetAtTime(on?s.th*.14:0,t,.05);eng.frequency.setTargetAtTime(45+s.th*45,t,.1)}
function gen(){const Q=Math.random,free=m=>docks.every(d=>Math.abs(d.m-m)>9);w={boxes:[],saws:[],lasers:[]};
for(let m=26;m<RIM-14;m+=7+Q()*9){if(!free(m))continue;const k=Q();if(k<.4)w.saws.push({m,sp:.9+Q()*1.1,ph:Q()*6.3,r:16,x:CX});else if(k<.62)w.lasers.push({m,ph:Q()*3})}
for(let i=0;i<55;i++){const m=16+Q()*(RIM-40),x0=CX+(Q()*2-1)*(hw(m)-45);w.boxes.push({x0,y0:m*PX,sp:.5+Q()*.8,ph:Q()*6.3,x:x0,y:m*PX,dead:false})}}
function reset(){applyUp();gen();s={x:CX,y:HH,vx:0,vy:0,fuel:MAXF,th:0,landed:'Estación',state:'play',cam:0,t:0,msg:'Mantén ▲ para despegar · Espacio dispara',msgT:5,parts:[],reason:'',shield:U.shield,cd:0,inv:0,bul:[]};renderShop()}
reset();
const say=(m,t=2.5)=>{s.msg=m;s.msgT=t};
function crash(why){
  s.state='crashed';s.reason=why;SND.crash();
  for(let i=0;i<40;i++){const a=Math.random()*6.28,v=40+Math.random()*160;s.parts.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+40,l:1})}
}
function land(top,name){
  if(-s.vy<=75&&Math.abs(s.vx)<=70){s.y=top+HH;s.vx=s.vy=0;s.landed=name;s.th=0;s.shield=U.shield;SND.land();renderShop();say(name==='Estación'?'En la estación. Tienda abierta':'Atracado en '+name+'. Tienda abierta')}
  else crash('Aterrizaje demasiado brusco');
}
function update(dt){
  s.t+=dt;if(s.msgT>0)s.msgT-=dt;
  s.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=200*dt;p.l-=dt*.8});
  s.parts=s.parts.filter(p=>p.l>0);engSnd();
  if(s.state!=='play')return;
  const up=K.up,l=K.l,r=K.r,fuel=s.fuel>0;stepWorld(dt);
  s.th+=((up&&fuel)?1.2:-3.5)*dt;s.th=Math.min(1,Math.max(0,s.th));
  if(s.th>0&&fuel)s.fuel=Math.max(0,s.fuel-8*s.th*dt);
  if(s.landed){
    if(TH*s.th>G){s.landed=null;say('¡Despegue!',1.5)}
    else{s.vx=s.vy=0;s.fuel=Math.min(MAXF,s.fuel+25*dt);return}
  }
  const ax=((r?1:0)-(l?1:0))*(s.fuel>0?AX:0);
  if((l||r)&&s.fuel>0)s.fuel=Math.max(0,s.fuel-1.5*dt);
  s.vx+=ax*dt;s.vx*=1-1.6*dt;
  s.vy+=(TH*s.th-G)*dt;s.vy*=1-DRAG*dt;
  const py=s.y;
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(s.fuel<=0&&!s.warned){say('¡Sin combustible! Desciende hasta un puerto',3);s.warned=true}
  if(s.fuel>5)s.warned=false;
  // paredes
  const m0=(s.y-HH)/PX,m1=s.y/PX,m2=(s.y+HH)/PX;
  for(const m of[m0,m1,m2]){const e=hw(m);if(s.x-HW<CX-e||s.x+HW>CX+e){crash('Chocaste con la pared del cráter');return}}
  collide();if(s.state!=='play')return;
  // puertos
  for(const d of docks){
    const top=d.m*PX,[x0,x1]=dockRect(d);
    if(s.vy<=0&&py-HH>=top-1&&s.y-HH<=top&&s.x>x0-6&&s.x<x1+6){land(top,'Puerto '+d.n);return}
  }
  if(s.y-HH<=0){land(0,'Estación');return}
  if(s.y>=(RIM+6)*PX){s.state='won';SND.win()}
}
const sy=wy=>H-120-(wy-s.cam);
const moons=[[70,70,34,'#e4693a'],[430,50,14,'#f08a4b'],[380,130,10,'#d9552f'],[60,190,16,'#f0a060'],[250,40,8,'#e4693a']];
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b0d22');g.addColorStop(.6,'#5a1a2c');g.addColorStop(1,'#8a2a2a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const o=s.cam*.03;
  ctx.fillStyle='#f3d3a0';ctx.beginPath();ctx.arc(300,300+o,170,0,6.3);ctx.fill();
  ctx.strokeStyle='#e0a070';ctx.lineWidth=14;ctx.beginPath();ctx.arc(300,300+o,185,3.4,5.6);ctx.stroke();
  moons.forEach(([x,y,r,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y+o*1.5,r,0,6.3);ctx.fill()});
}
function drawWalls(){
  const lo=s.cam-190,hi=s.cam+700;
  const layers=[[46,'#3d1220'],[22,'#7a2a2f'],[0,'#b3432e']];
  for(const[off,col]of layers){
    for(const side of[-1,1]){
      ctx.fillStyle=col;ctx.beginPath();
      const ex=side<0?-20:W+20;
      ctx.moveTo(ex,sy(lo));
      for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX)+off;ctx.lineTo(CX+side*e,sy(wy))}
      ctx.lineTo(ex,sy(hi));ctx.closePath();ctx.fill();
    }
  }
  ctx.strokeStyle='#ff8a4a';ctx.lineWidth=3;
  for(const side of[-1,1]){ctx.beginPath();for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX);const x=CX+side*e,y=sy(wy);wy===lo?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
}
function drawStation(){
  const y0=sy(0);
  ctx.fillStyle='#8e2f26';ctx.fillRect(0,y0,W,H);
  ctx.fillStyle='#c4553a';ctx.fillRect(0,y0,W,6);
  // módulo colonia
  ctx.fillStyle='#5b1c2a';ctx.fillRect(40,y0-80,10,80);ctx.fillRect(150,y0-80,10,80);
  ctx.fillStyle='#d9663a';ctx.beginPath();ctx.moveTo(24,y0-100);ctx.lineTo(60,y0-122);ctx.lineTo(150,y0-122);ctx.lineTo(186,y0-100);ctx.lineTo(150,y0-78);ctx.lineTo(60,y0-78);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a2230';ctx.fillRect(70,y0-112,70,12);
  ctx.fillStyle='#ffd9a8';for(let i=0;i<5;i++)ctx.fillRect(76+i*13,y0-109,8,6);
  ctx.fillStyle='#e8a070';ctx.fillRect(98,y0-160,6,40);ctx.fillRect(112,y0-148,6,28);
  ctx.fillStyle=(s.t*2|0)%2?'#ff4040':'#702020';ctx.fillRect(97,y0-166,8,6);
  // plataforma de despegue
  ctx.fillStyle='#3a1520';ctx.fillRect(CX-40,y0-3,80,6);
  ctx.fillStyle='#ffcf5a';ctx.fillRect(CX-40,y0-3,8,3);ctx.fillRect(CX+32,y0-3,8,3);
  ctx.fillStyle='#ffd9a8';ctx.font='11px Verdana';ctx.textAlign='center';ctx.fillText('ESTACIÓN',CX,y0+22);
}
function drawDocks(){
  for(const d of docks){
    const top=sy(d.m*PX),[x0,x1]=dockRect(d);
    if(top<-40||top>H+40)continue;
    const wallX=d.side<0?x0-30:x1;
    ctx.fillStyle='#4a1a28';ctx.fillRect(wallX,top,30,16);
    ctx.fillStyle='#e8a070';ctx.fillRect(x0,top,x1-x0,6);
    ctx.fillStyle='#7a2230';ctx.fillRect(x0,top+6,x1-x0,8);
    const on=(s.t*2|0)%2;
    ctx.fillStyle=on?'#ffcf5a':'#8a5a2a';ctx.fillRect(x0+2,top-3,6,3);ctx.fillRect(x1-8,top-3,6,3);
    // surtidor
    const px=d.side<0?x0+12:x1-24;
    ctx.fillStyle='#4ad0a0';ctx.fillRect(px,top-26,12,26);ctx.fillStyle='#103a30';ctx.fillRect(px+2,top-22,8,8);
    ctx.fillStyle='#ffd9a8';ctx.font='bold 11px Verdana';ctx.textAlign='center';
    ctx.fillText('PUERTO '+d.n+' · '+d.m+' m',(x0+x1)/2+(d.side<0?8:-8),top+28);
  }
}
function drawRim(){
  const y=sy(RIM*PX);if(y<-60||y>H+60)return;
  ctx.fillStyle='#ffd9a8';ctx.font='bold 14px Verdana';ctx.textAlign='center';
  ctx.fillText('BORDE DEL CRÁTER · '+RIM+' m',CX,y-8);
  ctx.strokeStyle='#ffd9a8';ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);
}
function drawShip(){
  if(s.state==='crashed')return;
  const x=s.x,y=sy(s.y);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.3,Math.min(.3,s.vx*.002)));
  if(s.th>.05&&s.fuel>0){
    const L=10+s.th*26*(.7+Math.random()*.5);
    for(const dx of[-8,8]){
      ctx.fillStyle='#ff9a2a';ctx.fillRect(dx-3,HH-6,6,L);
      ctx.fillStyle='#fff3b0';ctx.fillRect(dx-1,HH-6,2,L*.55);
    }
  }
  const h=HH*2,w=h*img.width/(img.height||1);
  if(img.complete&&img.width)ctx.drawImage(img,-w/2,-HH,w,h);
  else{ctx.fillStyle='#778';ctx.fillRect(-HW,-HH,HW*2,h)}
  ctx.restore();
}
function drawHUD(){
  const alt=Math.max(0,Math.round((s.y-HH)/PX*10)/10);
  ctx.fillStyle='#1a0a14cc';ctx.fillRect(8,8,170,114);
  ctx.textAlign='left';ctx.fillStyle='#ffd9a8';ctx.font='bold 15px Verdana';
  ctx.fillText('Altura '+alt.toFixed(1)+' m',18,30);
  ctx.font='12px Verdana';ctx.fillText('Velocidad '+Math.round(-s.vy/PX*10)/10+' m/s',18,48);
  const nd=docks.find(d=>d.m*PX>s.y-HH+4);
  ctx.fillText(nd?'Próximo puerto: '+(nd.m-alt).toFixed(0)+' m':'Siguiente: el borde ('+Math.max(0,RIM-alt).toFixed(0)+' m)',18,66);
  ctx.fillStyle='#3a1520';ctx.fillRect(18,74,150,10);
  const f=s.fuel/MAXF;ctx.fillStyle=f>.3?'#4ad0a0':'#ff4a3a';ctx.fillRect(18,74,150*f,10);
  ctx.fillStyle='#ffd9a8';ctx.font='10px Verdana';ctx.fillText('COMBUSTIBLE',22,82);
  ctx.fillStyle='#ffd9a8';ctx.font='bold 13px Verdana';ctx.fillText('$ '+money+'   Escudo '+s.shield+'/'+U.shield,18,110);
  const bx=W-12;ctx.fillStyle='#1a0a14cc';ctx.fillRect(bx,100,6,300);for(const d of docks){ctx.fillStyle='#4ad0a0';ctx.fillRect(bx-3,400-d.m/RIM*300-1,12,2)}ctx.fillStyle='#ff7a3d';ctx.fillRect(bx-2,400-Math.min(1,alt/RIM)*300-3,10,6);
  if(s.msgT>0&&s.state==='play'){ctx.textAlign='center';ctx.font='bold 15px Verdana';ctx.fillStyle='#1a0a14cc';const tw=ctx.measureText(s.msg).width+24;ctx.fillRect(CX-tw/2,H-190,tw,30);ctx.fillStyle='#ffd9a8';ctx.fillText(s.msg,CX,H-170)}
}
function hit(why){
  if(s.inv>0)return;
  if(s.shield>0){s.shield--;s.inv=1.5;SND.hit();say('¡Escudo dañado!',1.5);for(let i=0;i<14;i++)s.parts.push({x:s.x,y:s.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5})}
  else crash(why)
}
function breakBox(x){const g=10+(Math.random()*15|0);money+=g;SND.box();SND.coin();for(let i=0;i<10;i++){const a=Math.random()*6.28,v=30+Math.random()*90;s.parts.push({x:x.x,y:x.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6})}say('+$'+g,1)}
function stepWorld(dt){
  s.cd-=dt;s.inv-=dt;
  if(K.fire&&s.cd<=0){s.cd=CD;s.bul.push({x:s.x,y:s.y+HH,vx:s.vx*.3,life:1.1});SND.shoot()}
  for(const b of w.boxes)if(!b.dead){b.x=b.x0+Math.sin(s.t*b.sp+b.ph)*35;b.y=b.y0+Math.cos(s.t*b.sp*.8+b.ph)*18}
  for(const q of w.saws)q.x=CX+Math.sin(s.t*q.sp+q.ph)*(hw(q.m)-26);
  for(const l of w.lasers){const on=((s.t+l.ph)%3)>1.7;if(on&&!l.on&&Math.abs(l.m*PX-s.y)<500)SND.laser();l.on=on;l.warn=((s.t+l.ph)%3)>1.1}
  for(const b of s.bul){b.y+=520*dt;b.x+=b.vx*dt;b.life-=dt;
    if(Math.abs(b.x-CX)>hw(b.y/PX))b.life=0;
    for(const q of w.saws)if(Math.abs(b.x-q.x)<18&&Math.abs(b.y-q.m*PX)<18)b.life=0;
    for(const x of w.boxes)if(!x.dead&&Math.abs(b.x-x.x)<16&&Math.abs(b.y-x.y)<16){x.dead=true;b.life=0;breakBox(x)}}
  s.bul=s.bul.filter(b=>b.life>0);
}
function collide(){
  for(const b of w.boxes)if(!b.dead&&Math.abs(s.x-b.x)<HW+11&&Math.abs(s.y-b.y)<HH+8){b.dead=true;hit('Chocaste con una caja')}
  for(const q of w.saws)if(Math.abs(s.x-q.x)<HW+q.r-3&&Math.abs(s.y-q.m*PX)<HH+q.r-3)hit('La sierra te cortó');
  for(const l of w.lasers)if(l.on&&Math.abs(s.y-l.m*PX)<HH+3)hit('Te alcanzó el láser');
}
function drawObs(){
  const lo=s.cam-80,hi=s.cam+H;
  for(const b of w.boxes){if(b.dead||b.y<lo||b.y>hi)continue;const y=sy(b.y);ctx.fillStyle='#c98a3a';ctx.fillRect(b.x-11,y-11,22,22);ctx.strokeStyle='#5a3410';ctx.lineWidth=2;ctx.strokeRect(b.x-11,y-11,22,22);ctx.beginPath();ctx.moveTo(b.x-11,y-11);ctx.lineTo(b.x+11,y+11);ctx.moveTo(b.x+11,y-11);ctx.lineTo(b.x-11,y+11);ctx.stroke()}
  for(const q of w.saws){const wy=q.m*PX;if(wy<lo||wy>hi)continue;ctx.save();ctx.translate(q.x,sy(wy));ctx.rotate(s.t*8);ctx.fillStyle='#d8dbe8';ctx.beginPath();
    for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?q.r-5:q.r+3;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.closePath();ctx.fill();ctx.fillStyle='#4a1a28';ctx.beginPath();ctx.arc(0,0,5,0,6.3);ctx.fill();ctx.restore()}
  for(const l of w.lasers){const wy=l.m*PX;if(wy<lo||wy>hi)continue;const y=sy(wy),e=hw(l.m);
    ctx.fillStyle='#8a8fa8';ctx.fillRect(CX-e,y-8,12,16);ctx.fillRect(CX+e-12,y-8,12,16);
    if(l.on){ctx.fillStyle='#ff3a3a';ctx.fillRect(CX-e+12,y-3,2*e-24,6);ctx.fillStyle='#fff';ctx.fillRect(CX-e+12,y-1,2*e-24,2)}
    else if(l.warn){ctx.fillStyle='#ff3a3a66';ctx.fillRect(CX-e+12,y-1,2*e-24,2)}}
  ctx.fillStyle='#ffe38a';for(const b of s.bul)ctx.fillRect(b.x-1.5,sy(b.y)-6,3,12);
  if(s.state==='play'&&(s.shield>0||s.inv>0)){ctx.strokeStyle=s.inv>0?'#fff':'#6ad0ff66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,sy(s.y),HH+4,0,6.3);ctx.stroke()}
}
function overlay(t1,t2){
  ctx.fillStyle='#1a0a14dd';ctx.fillRect(0,H/2-90,W,160);
  ctx.textAlign='center';ctx.fillStyle='#ff7a3d';ctx.font='bold 30px Verdana';ctx.fillText(t1,CX,H/2-35);
  ctx.fillStyle='#ffd9a8';ctx.font='15px Verdana';ctx.fillText(t2,CX,H/2);
  ctx.fillText('Pulsa R o Enter para reintentar',CX,H/2+40);
}
function draw(){
  const tgt=Math.max(0,s.y-300);s.cam+=(tgt-s.cam)*.12;
  drawSky();drawWalls();drawStation();drawDocks();drawRim();drawObs();drawShip();
  s.parts.forEach(p=>{ctx.fillStyle=Math.random()<.5?'#ff9a2a':'#ffd9a8';ctx.fillRect(p.x,sy(p.y),4,4)});
  drawHUD();shopSync();
  if(s.state==='crashed')overlay('Nave destruida',s.reason);
  if(s.state==='won')overlay('¡Saliste del cráter!','Te quedaba '+Math.round(s.fuel)+'% de combustible');
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
